<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#2A2D2E">
  <title>PK.GAME Predict · Prototype</title>
  <meta name="description" content="PK.GAME prediction markets prototype — live Polymarket data, demo bets only.">
  <link rel="icon" href="assets/img/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/pkgame-ds.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="pk-skip-link" href="#main" data-i18n="skip">Skip to content</a>

  <header class="pk-header app-header">
    <a href="#/" class="app-brand" aria-label="PK.GAME Predict home">
      <img src="assets/img/logo.svg" alt="PK.GAME" width="131" height="32">
      <span class="app-brand-tag" data-i18n="brandTag">Predict</span>
    </a>
    <nav class="pk-navpills app-topnav" aria-label="Main">
      <ul class="pk-navpills-list">
        <li class="pk-navpills-item"><a class="pk-navpill" href="#/" data-nav="markets"><span class="pk-navpill-label" data-i18n="navMarkets">Markets</span></a></li>
        <li class="pk-navpills-item"><a class="pk-navpill" href="#/bets" data-nav="bets"><span class="pk-navpill-label" data-i18n="navBets">My bets</span></a></li>
        <li class="pk-navpills-item"><a class="pk-navpill" href="#/about" data-nav="about"><span class="pk-navpill-label" data-i18n="navAbout">How it works</span></a></li>
      </ul>
    </nav>
    <div class="app-header-actions">
      <span class="app-balance" title="Demo balance">
        <span class="app-balance-label" data-i18n="demo">Demo</span>
        <span class="pk-amount num" id="balance">PK$ 0.00</span>
      </span>
      <button class="pk-button app-lang" data-variant="secondary" data-preset="header" id="lang-toggle" type="button" aria-label="Switch language">中文</button>
    </div>
  </header>

  <div class="app-statusbar" id="statusbar" role="status" aria-live="polite"></div>

  <main id="main" class="app-main" tabindex="-1"></main>

  <aside class="app-slip" id="slip" aria-label="Bet slip" hidden></aside>

  <nav class="app-tabbar" aria-label="Main">
    <a class="pk-tabbar-item" href="#/" data-nav="markets">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span data-i18n="navMarkets">Markets</span>
    </a>
    <a class="pk-tabbar-item" href="#/bets" data-nav="bets">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 15h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span data-i18n="navBets">My bets</span>
    </a>
    <a class="pk-tabbar-item" href="#/about" data-nav="about">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span data-i18n="navAbout">How it works</span>
    </a>
  </nav>

  <div class="app-toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
